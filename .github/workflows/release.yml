name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (.exe, one-file)
        run: pyinstaller --noconfirm LouLLabs_STT.spec

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LouLLabs_STT.exe
          name: LouLLabs STT ${{ github.ref_name }}
          body: |
            **LouLLabs STT** - 100% local voice dictation for Windows.

            ### Installation
            1. Download `LouLLabs_STT.exe` below (a single file - nothing to unzip).
            2. Run it.
            3. On the **first launch**, the Whisper model (~460 MB, default `small`) downloads just once. After that, everything is offline.
            4. Hold **F8**, speak, release - the text is inserted.

            > The executable is not signed: Windows SmartScreen may display a warning ("More info" → "Run anyway").
            > Third-party licenses (including LGPL Qt/FFmpeg): see `docs/THIRD_PARTY_LICENSES.md`.
